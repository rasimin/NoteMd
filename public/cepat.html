<!doctype html>
<html lang="id" translate="no" class="notranslate">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="google" content="notranslate">
  <title>Note Cepat · AI Note</title>
  <link rel="icon" href="/favicon-cepat.svg" type="image/svg+xml">
  <link rel="manifest" href="/manifest-cepat.json">
  <meta name="theme-color" content="#1a1a1a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Note Cepat">
  <link rel="apple-touch-icon" href="/icon-cepat-192.png">
  <script src="/theme.js"></script>
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/editor-visual.css">
  <link rel="stylesheet" href="/cepat.css">
</head>
<body class="qc-body">
  <div class="qc-app" id="qc-app">
    <header class="qc-tabbar" id="qc-tabbar" aria-label="Tab catatan cepat">
      <button type="button" class="qc-tab-scroll" id="qc-tabs-left" title="Geser tab ke kiri" aria-label="Geser tab ke kiri" hidden>‹</button>
      <div class="qc-tabs" id="qc-tabs" role="tablist"></div>
      <button type="button" class="qc-tab-scroll" id="qc-tabs-right" title="Geser tab ke kanan" aria-label="Geser tab ke kanan" hidden>›</button>
      <button type="button" class="qc-tab-add" id="qc-new-tab" title="Tab baru (Ctrl+T)" aria-label="Tab baru">+</button>
      <div class="qc-tab-list-wrap">
        <button type="button" class="qc-tab-list-btn" id="qc-tab-list-btn" title="Daftar semua tab" aria-label="Daftar semua tab" aria-haspopup="menu" aria-expanded="false" hidden>▾</button>
        <div class="qc-tab-list-pop" id="qc-tab-list-pop" role="menu" hidden></div>
      </div>
    </header>

    <main class="qc-editor-wrap visual" id="qc-editor-wrap">
      <div class="qc-visual" id="qc-visual"></div>
    </main>

    <div class="qc-banner" id="qc-banner" role="alert" hidden>
      <span class="qc-banner-msg" id="qc-banner-msg"></span>
      <div class="qc-banner-actions" id="qc-banner-actions"></div>
    </div>

    <footer class="qc-statusbar" id="qc-statusbar">
      <div class="qc-status-left">
        <button type="button" class="btn btn-ghost btn-sm qc-folder-btn" id="qc-folder-btn" title="Pilih folder tujuan (Ctrl+Shift+S)">
          <span class="qc-folder-icon" id="qc-folder-icon"></span>
          <span class="qc-folder-label" id="qc-folder-label">Catatan Cepat</span>
          <span class="qc-caret">▾</span>
        </button>
        <div class="qc-more-wrap">
          <button type="button" class="btn btn-ghost btn-icon qc-icon-btn qc-more-btn" id="qc-more-btn" title="Lainnya" aria-label="Lainnya" aria-haspopup="menu" aria-expanded="false">&#8943;</button>
          <div class="qc-more-pop" id="qc-more-pop" role="menu" hidden>
            <button type="button" class="qc-menu-item" id="pwa-install-btn" role="menuitem" hidden></button>
            <button type="button" class="qc-menu-item" id="qc-theme-btn" role="menuitem"></button>
            <a class="qc-menu-item" id="qc-home-link" role="menuitem" href="/" target="_blank" rel="noopener"></a>
          </div>
        </div>
        <span class="qc-status-text" id="qc-status">Siap menulis</span>
      </div>
      <div class="qc-status-actions">
        <button type="button" class="btn btn-ghost btn-sm" id="qc-detail-btn" title="Ringkasan, tag, dan lingkungan">Detail</button>
        <button type="button" class="btn btn-ghost btn-sm" id="qc-attach-btn" title="Lampirkan gambar atau file">Lampirkan</button>
        <input type="file" id="qc-attach-input" multiple hidden>
        <button type="button" class="btn btn-primary btn-sm" id="qc-save-btn" title="Simpan (Ctrl+S). Ganti nama: klik dua kali judul tab">Simpan</button>
      </div>
    </footer>
  </div>

  <div class="qc-modal-root" id="qc-modal-root" hidden></div>
  <div class="qc-toast" id="qc-toast" role="status" aria-live="polite" hidden></div>

  <script src="/editor-visual.js"></script>
  <script src="/dialogs.js"></script>
  <script src="/cepat.js"></script>
  <script src="/pwa.js"></script>
</body>
</html>
